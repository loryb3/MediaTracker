<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediaTracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121017;
  --bg-alt:#0d0c12;
  --surface:#1b1822;
  --surface-alt:#241f2e;
  --border:#332c3d;
  --text:#f3efea;
  --text-dim:#a79fb0;
  --text-faint:#6f6879;
  --accent:#e3a83b;
  --accent-dim:#8a6a2a;
  --anime:#4fb6a8;
  --danger:#e8604c;
  --radius:10px;
  --display:'Bebas Neue',sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:'';
  position:fixed; inset:0;
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(227,168,59,0.07), transparent 60%),
    radial-gradient(ellipse 700px 500px at 90% 0%, rgba(79,182,168,0.05), transparent 60%);
  pointer-events:none;
  z-index:0;
}
#app{position:relative; z-index:1; max-width:1180px; margin:0 auto; padding:0 20px 80px;}
a{color:inherit;}
button{font-family:var(--body); cursor:pointer;}
::selection{background:var(--accent); color:#1a1408;}

/* ---------- Top bar ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:22px 0 18px; gap:16px; flex-wrap:wrap;
}
.brand{display:flex; align-items:baseline; gap:10px;}
.brand-mark{
  font-family:var(--display); font-size:30px; letter-spacing:1px; color:var(--text);
  line-height:1;
}
.brand-mark span{color:var(--accent);}
.brand-tag{font-size:11px; color:var(--text-faint); font-family:var(--mono); letter-spacing:0.5px;}
.nav{display:flex; gap:4px; background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:4px;}
.nav button{
  background:none; border:none; color:var(--text-dim); font-size:13px; font-weight:600;
  padding:8px 16px; border-radius:999px; transition:all .15s ease; position:relative;
}
.nav button:hover{color:var(--text);}
.nav button.active{background:var(--accent); color:#1a1408;}
.nav button .dot{
  position:absolute; top:4px; right:6px; width:7px; height:7px; border-radius:50%;
  background:var(--danger); border:1.5px solid var(--surface);
}

/* ---------- Notification banner ---------- */
.banner{
  background:linear-gradient(90deg, rgba(227,168,59,0.14), rgba(227,168,59,0.03));
  border:1px solid var(--accent-dim); border-radius:var(--radius);
  padding:14px 18px; margin-bottom:22px; display:flex; align-items:flex-start; gap:12px;
}
.banner-icon{font-size:18px; line-height:1.4;}
.banner-body{flex:1;}
.banner-title{font-weight:700; font-size:14px; margin-bottom:6px;}
.banner-list{display:flex; flex-direction:column; gap:4px;}
.banner-item{font-size:13px; color:var(--text-dim);}
.banner-item b{color:var(--text); font-weight:600;}
.banner-actions{display:flex; gap:8px; margin-top:10px;}
.btn-sm{
  background:var(--surface-alt); border:1px solid var(--border); color:var(--text);
  font-size:12px; padding:6px 12px; border-radius:6px; font-weight:600;
}
.btn-sm:hover{border-color:var(--accent);}

/* ---------- Toolbar / filters ---------- */
.toolbar{display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; align-items:center;}
.seg{display:flex; background:var(--surface); border:1px solid var(--border); border-radius:8px; overflow:hidden;}
.seg button{background:none; border:none; color:var(--text-dim); font-size:12px; font-weight:600; padding:8px 14px; border-right:1px solid var(--border);}
.seg button:last-child{border-right:none;}
.seg button.active{background:var(--surface-alt); color:var(--accent);}
.search-box{
  flex:1; min-width:180px; background:var(--surface); border:1px solid var(--border); border-radius:8px;
  display:flex; align-items:center; padding:0 12px; gap:8px;
}
.search-box input{
  background:none; border:none; outline:none; color:var(--text); font-size:13px; padding:9px 0; width:100%; font-family:var(--body);
}
.search-box input::placeholder{color:var(--text-faint);}
.count-pill{font-family:var(--mono); font-size:11px; color:var(--text-faint);}

/* ---------- Library grid ---------- */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); gap:16px;}
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;
  cursor:pointer; transition:transform .15s ease, border-color .15s ease; display:flex; flex-direction:column;
}
.card:hover{transform:translateY(-3px); border-color:var(--accent-dim);}
.poster-wrap{position:relative; aspect-ratio:2/3; background:var(--surface-alt); overflow:hidden;}
.poster-wrap img{width:100%; height:100%; object-fit:cover; display:block;}
.poster-empty{width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:var(--text-faint); font-family:var(--display); font-size:22px; text-align:center; padding:10px;}
.badge-type{
  position:absolute; top:8px; left:8px; font-size:9px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase;
  padding:3px 7px; border-radius:5px; background:rgba(18,16,23,0.85); backdrop-filter:blur(4px);
  border:1px solid rgba(255,255,255,0.1);
}
.badge-type.anime{color:var(--anime);}
.badge-type.tv{color:var(--accent);}
.badge-type.movie{color:#c9a9e8;}
.badge-status{
  position:absolute; bottom:8px; left:8px; font-size:9px; font-weight:700; letter-spacing:0.3px; text-transform:uppercase;
  padding:3px 7px; border-radius:5px; background:rgba(18,16,23,0.85);
}
.card-body{padding:10px 11px 12px; display:flex; flex-direction:column; gap:6px; flex:1;}
.card-title{font-size:13px; font-weight:600; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.card-meta{font-size:11px; color:var(--text-faint); font-family:var(--mono);}

/* ---------- Filmstrip signature progress ---------- */
.filmstrip{display:flex; gap:1.5px; height:12px; border-radius:3px; overflow:hidden; background:var(--bg-alt);}
.filmstrip .tick{flex:1; min-width:2px; background:var(--surface-alt);}
.filmstrip .tick.on{background:var(--accent);}
.filmstrip.anime .tick.on{background:var(--anime);}
.filmstrip-bar{
  position:relative; height:12px; border-radius:3px; background:var(--bg-alt); overflow:hidden;
  background-image:repeating-linear-gradient(90deg, var(--bg-alt) 0, var(--bg-alt) 3px, var(--border) 3px, var(--border) 4px);
}
.filmstrip-bar .fill{position:absolute; inset:0; width:0%; background:var(--accent); mix-blend-mode:normal;}
.filmstrip-bar.anime .fill{background:var(--anime);}
.progress-label{font-size:10px; color:var(--text-faint); font-family:var(--mono); display:flex; justify-content:space-between;}

/* ---------- Empty state ---------- */
.empty{
  text-align:center; padding:70px 20px; color:var(--text-faint);
}
.empty .em-mark{font-family:var(--display); font-size:38px; color:var(--text-dim); letter-spacing:1px; margin-bottom:8px;}
.empty p{font-size:13px; max-width:360px; margin:8px auto 0;}

/* ---------- Section headers ---------- */
.section-title{font-family:var(--display); font-size:22px; letter-spacing:0.5px; margin:6px 0 16px; color:var(--text);}
.section-title span{color:var(--accent);}

/* ---------- Calendar ---------- */
.cal-list{display:flex; flex-direction:column; gap:10px;}
.cal-row{
  display:flex; align-items:center; gap:14px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); padding:12px 14px; cursor:pointer;
}
.cal-row:hover{border-color:var(--accent-dim);}
.cal-date{
  font-family:var(--mono); font-size:11px; color:var(--accent); background:var(--surface-alt);
  border:1px solid var(--border); border-radius:7px; padding:8px 10px; text-align:center; min-width:56px;
}
.cal-date .d{font-size:16px; font-weight:600; color:var(--text); display:block;}
.cal-poster{width:38px; height:56px; border-radius:5px; object-fit:cover; background:var(--surface-alt); flex-shrink:0;}
.cal-info{flex:1; min-width:0;}
.cal-title{font-size:13px; font-weight:600;}
.cal-sub{font-size:11px; color:var(--text-faint); margin-top:2px;}

/* ---------- Search view ---------- */
.search-hero{display:flex; gap:10px; margin-bottom:24px;}
.search-hero input{
  flex:1; background:var(--surface); border:1px solid var(--border); border-radius:8px; color:var(--text);
  font-size:14px; padding:13px 16px; outline:none; font-family:var(--body);
}
.search-hero input:focus{border-color:var(--accent);}
.search-hero button{
  background:var(--accent); border:none; color:#1a1408; font-weight:700; font-size:13px; padding:0 20px; border-radius:8px;
}
.result-card{
  display:flex; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:10px; margin-bottom:10px; align-items:center;
}
.result-poster{width:46px; height:68px; border-radius:6px; object-fit:cover; background:var(--surface-alt); flex-shrink:0;}
.result-info{flex:1; min-width:0;}
.result-title{font-size:14px; font-weight:600;}
.result-meta{font-size:11px; color:var(--text-faint); font-family:var(--mono); margin-top:2px;}
.result-overview{font-size:12px; color:var(--text-dim); margin-top:4px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.btn-add{
  background:var(--surface-alt); border:1px solid var(--border); color:var(--text); font-size:12px; font-weight:600;
  padding:8px 14px; border-radius:7px; white-space:nowrap;
}
.btn-add:hover{border-color:var(--accent); color:var(--accent);}
.btn-add.added{background:var(--accent); color:#1a1408; border-color:var(--accent);}

/* ---------- Import view ---------- */
.import-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:22px; margin-bottom:18px;}
.import-card h3{margin:0 0 6px; font-size:15px;}
.import-card p{margin:0 0 14px; font-size:12px; color:var(--text-dim); line-height:1.5;}
.file-drop{
  border:1.5px dashed var(--border); border-radius:8px; padding:18px; text-align:center; font-size:12px; color:var(--text-faint);
  position:relative;
}
.file-drop input{position:absolute; inset:0; opacity:0; cursor:pointer;}
.file-drop.has-file{border-color:var(--accent); color:var(--accent);}
.import-progress{margin-top:16px;}
.bar-track{height:6px; background:var(--bg-alt); border-radius:3px; overflow:hidden;}
.bar-fill{height:100%; background:var(--accent); width:0%; transition:width .2s ease;}
.import-log{font-family:var(--mono); font-size:11px; color:var(--text-faint); margin-top:8px;}
.btn-primary{
  background:var(--accent); border:none; color:#1a1408; font-weight:700; font-size:13px; padding:11px 22px; border-radius:8px;
}
.btn-primary:disabled{opacity:0.5; cursor:not-allowed;}
.import-summary{margin-top:14px; font-size:12px; color:var(--text-dim); line-height:1.7;}
.import-summary b{color:var(--text);}
.notfound-list{margin-top:8px; max-height:140px; overflow-y:auto; font-size:11px; color:var(--text-faint); font-family:var(--mono);}
/* Setup screen */
.setup-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;padding:32px 20px;text-align:center;}
.setup-logo{font-size:28px;font-weight:800;letter-spacing:3px;color:var(--text);margin-bottom:6px;}
.setup-logo span{color:var(--accent);}
.setup-subtitle{font-size:13px;color:var(--text-faint);margin-bottom:40px;}
.setup-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px 24px;width:100%;max-width:440px;}
.setup-card h2{font-size:16px;font-weight:700;margin:0 0 8px;}
.setup-card p{font-size:13px;color:var(--text-faint);margin:0 0 20px;line-height:1.6;}
.setup-card a{color:var(--accent);text-decoration:none;}
.setup-steps{text-align:left;font-size:12px;color:var(--text-faint);margin:0 0 20px;padding-left:16px;line-height:2;}
.setup-input-row{display:flex;gap:8px;align-items:stretch;}
.setup-input-row input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:13px;font-family:var(--mono);}
.setup-input-row input:focus{outline:none;border-color:var(--accent);}
.setup-input-row button{padding:10px 16px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
.setup-error{font-size:12px;color:#e05;margin-top:8px;min-height:16px;}
/* Settings view */
.settings-section{padding:24px 20px;max-width:480px;margin:0 auto;}
.settings-section h2{font-size:15px;font-weight:700;margin:0 0 16px;}
.settings-row{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px;}
.settings-row label{display:block;font-size:12px;color:var(--text-faint);margin-bottom:8px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;}
.settings-row .key-display{font-family:var(--mono);font-size:12px;color:var(--text-faint);background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 10px;margin-bottom:10px;word-break:break-all;}
.settings-row .key-display .key-masked{letter-spacing:2px;}

/* ---------- Modal ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(8,7,11,0.75); backdrop-filter:blur(3px);
  display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; z-index:100; overflow-y:auto;
}
.modal{
  background:var(--surface); border:1px solid var(--border); border-radius:14px; max-width:640px; width:100%;
  overflow:hidden;
}
.modal-hero{position:relative; height:180px; background:var(--surface-alt); background-size:cover; background-position:center top;}
.modal-hero::after{content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(18,16,23,0.2), var(--surface) 95%);}
.modal-close{
  position:absolute; top:12px; right:12px; z-index:2; background:rgba(8,7,11,0.6); border:1px solid rgba(255,255,255,0.15);
  color:var(--text); width:30px; height:30px; border-radius:50%; font-size:15px; display:flex; align-items:center; justify-content:center;
}
.modal-body{padding:0 24px 24px;}
.modal-title{font-family:var(--display); font-size:26px; letter-spacing:0.5px; margin:0 0 4px;}
.modal-meta{font-size:12px; color:var(--text-faint); font-family:var(--mono); margin-bottom:14px;}
.modal-overview{font-size:13px; color:var(--text-dim); line-height:1.6; margin-bottom:18px;}
.status-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
.status-btn{
  background:var(--surface-alt); border:1px solid var(--border); color:var(--text-dim); font-size:11px; font-weight:600;
  padding:7px 13px; border-radius:999px;
}
.status-btn.active{background:var(--accent); color:#1a1408; border-color:var(--accent);}
.modal-actions{display:flex; gap:8px; margin-bottom:18px;}
.season-list{display:flex; flex-direction:column; gap:8px;}
.season-head{
  display:flex; align-items:center; justify-content:space-between; padding:11px 13px; background:var(--surface-alt);
  border:1px solid var(--border); border-radius:8px; cursor:pointer;
}
.season-name{font-size:13px; font-weight:600;}
.season-progress{font-size:11px; color:var(--text-faint); font-family:var(--mono); margin-top:2px;}
.season-mark-btn{
  background:none; border:1px solid var(--border); color:var(--accent); font-size:10px; font-weight:700;
  padding:5px 10px; border-radius:6px; white-space:nowrap;
}
.episode-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(44px,1fr)); gap:5px; padding:10px 4px;}
.ep-chip{
  aspect-ratio:1; border-radius:6px; background:var(--bg-alt); border:1px solid var(--border); color:var(--text-faint);
  font-family:var(--mono); font-size:11px; display:flex; align-items:center; justify-content:center; font-weight:600;
}
.ep-chip.watched{background:var(--accent); color:#1a1408; border-color:var(--accent);}
.episode-loading{padding:14px; font-size:11px; color:var(--text-faint); text-align:center; font-family:var(--mono);}
.movie-actions{display:flex; gap:10px; align-items:center;}
.toggle-watched{
  background:var(--surface-alt); border:1px solid var(--border); color:var(--text); font-size:12px; font-weight:600;
  padding:9px 16px; border-radius:8px;
}
.toggle-watched.on{background:var(--accent); color:#1a1408; border-color:var(--accent);}
.remove-link{font-size:11px; color:var(--text-faint); text-decoration:underline; margin-top:16px; display:inline-block;}
.remove-link:hover{color:var(--danger);}

/* ---------- Toast ---------- */
.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--surface-alt); border:1px solid var(--accent-dim);
  color:var(--text); font-size:12px; padding:10px 18px; border-radius:999px; z-index:200; box-shadow:0 8px 24px rgba(0,0,0,0.4);
}

@media (max-width:560px){
  .topbar{flex-direction:column; align-items:flex-start;}
  .nav{overflow-x:auto; width:100%;}
}
</style>
</head>
<body>
<div id="app"><div class="empty"><div class="em-mark">Caricamento…</div></div></div>
<script>
/* =========================================================
   CONFIG
========================================================= */
let TMDB_KEY = '';
const TMDB_BASE = 'https://api.themoviedb.org/3';
const IMG_POSTER = 'https://image.tmdb.org/t/p/w342';
const IMG_BACKDROP = 'https://image.tmdb.org/t/p/w780';
const GENRE_ANIMATION = 16;

/* =========================================================
   STORAGE (persistent, falls back to in-memory if unavailable)
========================================================= */
const LS_PREFIX = 'mediatracker:';
let MEM_FALLBACK = {};
function hasClaudeStorage(){ return typeof window.storage !== 'undefined' && window.storage; }
function hasLocalStorage(){
  try{ const k='__mt_test__'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }
  catch(e){ return false; }
}
async function storeGet(key){
  if(hasClaudeStorage()){
    try{
      const res = await window.storage.get(key, false);
      return res ? res.value : null;
    }catch(e){ /* fall through to localStorage/memory below */ }
  }
  if(hasLocalStorage()){
    try{
      const v = localStorage.getItem(LS_PREFIX+key);
      return v !== null ? v : null;
    }catch(e){ /* read failed despite passing the write test - fall through to memory */ }
  }
  return MEM_FALLBACK[key] !== undefined ? MEM_FALLBACK[key] : null;
}
async function storeSet(key, value){
  MEM_FALLBACK[key] = value;
  if(hasClaudeStorage()){
    try{ await window.storage.set(key, value, false); return; }
    catch(e){ /* fall through */ }
  }
  if(hasLocalStorage()){
    try{ localStorage.setItem(LS_PREFIX+key, value); }catch(e){ /* quota exceeded or blocked - stays in memory only */ }
  }
}

async function loadLibrary(){
  const raw = await storeGet('library');
  if(!raw) return [];
  try{ return JSON.parse(raw); }catch(e){ return []; }
}
async function saveLibrary(){ await storeSet('library', JSON.stringify(LIB)); }

async function loadNotifs(){
  const raw = await storeGet('notifications');
  if(!raw) return [];
  try{ return JSON.parse(raw); }catch(e){ return []; }
}
async function saveNotifs(){ await storeSet('notifications', JSON.stringify(NOTIFS)); }

async function loadSettings(){
  const raw = await storeGet('settings');
  if(!raw) return {lastCheck:null, tmdbKey:''};
  try{
    const s = JSON.parse(raw);
    if(!s.tmdbKey) s.tmdbKey = '';
    return s;
  }catch(e){ return {lastCheck:null, tmdbKey:''}; }
}
async function saveSettings(){ await storeSet('settings', JSON.stringify(SETTINGS)); }

/* =========================================================
   STATE
========================================================= */
let LIB = [];
let NOTIFS = [];
let SETTINGS = {lastCheck:null, tmdbKey:''};
let VIEW = 'library';
let FILTER = {status:'all', type:'all', q:''};
let BRAND_STAT_VIEW = 'count'; // 'count' | 'time'
let SEARCH_RESULTS = [];
let SEARCH_QUERY = '';
let SEARCH_LOADING = false;
let OPEN_ITEM = null; // currently open modal item id
let OPEN_SEASONS = {}; // season_number -> episodes[] (runtime cache for open modal)
let EXPANDED_SEASONS = {}; // season_number -> bool
let IMPORT_STATE = {running:false, log:[], progress:0, total:0, summary:null, seriesFile:null, moviesFile:null};
let TOAST_TIMER = null;

function uid(){ return 'x'+Math.random().toString(36).slice(2)+Date.now().toString(36); }
function todayISO(){ return new Date().toISOString().slice(0,10); }

/* =========================================================
   TMDB API
========================================================= */
async function tmdbGet(path, params){
  const url = new URL(TMDB_BASE + path);
  url.searchParams.set('api_key', TMDB_KEY);
  url.searchParams.set('language', 'it-IT');
  if(params){ for(const k in params){ url.searchParams.set(k, params[k]); } }
  const res = await fetch(url.toString());
  if(!res.ok){
    if(res.status === 404) return null;
    throw new Error('TMDB error '+res.status);
  }
  return res.json();
}
async function tmdbSearchMulti(query){
  const data = await tmdbGet('/search/multi', {query, include_adult:'false'});
  if(!data) return [];
  return (data.results||[]).filter(r => r.media_type === 'movie' || r.media_type === 'tv');
}

/* simple concurrency-limited pool runner */
async function runPool(items, worker, concurrency, onProgress){
  let idx = 0; let done = 0;
  const results = new Array(items.length);
  async function next(){
    if(idx >= items.length) return;
    const my = idx++;
    try{ results[my] = await worker(items[my], my); }
    catch(e){ results[my] = {error:e}; }
    done++;
    if(onProgress) onProgress(done, items.length, items[my]);
    await next();
  }
  const runners = [];
  for(let i=0;i<concurrency;i++) runners.push(next());
  await Promise.all(runners);
  return results;
}

   DOMAIN LOGIC
========================================================= */
function isAnimeFromDetail(detail){
  const originJP = (detail.origin_country||[]).includes('JP') || (detail.production_countries||[]).some(c=>c.iso_3166_1==='JP');
  const genres = (detail.genres||[]).map(g=>g.id);
  const isAnimation = genres.includes(GENRE_ANIMATION);
  const spokenJP = (detail.spoken_languages||[]).some(l=>l.iso_639_1==='ja') || detail.original_language==='ja';
  return isAnimation && (originJP || spokenJP);
}

function findLibItem(tmdbId, mediaType){
  return LIB.find(i => i.tmdbId === tmdbId && i.mediaType === mediaType);
}

function buildTVItem(detail, statusOverride){
  const seasonsMeta = (detail.seasons||[])
    .filter(s => s.season_number !== undefined)
    .map(s => ({season_number:s.season_number, name:s.name, episode_count:s.episode_count, air_date:s.air_date}));
  const totalKnown = seasonsMeta.filter(s=>s.season_number>0).reduce((a,s)=>a+(s.episode_count||0),0);
  return {
    id: uid(),
    tmdbId: detail.id,
    mediaType: 'tv',
    title: detail.name,
    posterPath: detail.poster_path,
    backdropPath: detail.backdrop_path,
    overview: detail.overview,
    firstAirDate: detail.first_air_date,
    originCountry: detail.origin_country,
    genres: (detail.genres||[]).map(g=>g.name),
    isAnime: isAnimeFromDetail(detail),
    status: statusOverride || 'watchlist',
    seasonsMeta,
    knownEpisodeCount: totalKnown,
    tmdbStatus: detail.status,
    inProduction: detail.in_production,
    nextEpisodeToAir: detail.next_episode_to_air ? {
      air_date: detail.next_episode_to_air.air_date,
      episode_number: detail.next_episode_to_air.episode_number,
      season_number: detail.next_episode_to_air.season_number,
      name: detail.next_episode_to_air.name
    } : null,
    watched: {}, // {seasonNumber: {episodeNumber: {w:true, at:'...'}}}
    episodeRuntime: (detail.episode_run_time && detail.episode_run_time.length) ? detail.episode_run_time[0] : null,
    addedAt: new Date().toISOString()
  };
}

function buildMovieItem(detail, watchedFlag, watchedAt, statusOverride){
  const released = detail.release_date && detail.release_date <= todayISO();
  return {
    id: uid(),
    tmdbId: detail.id,
    mediaType: 'movie',
    title: detail.title,
    posterPath: detail.poster_path,
    backdropPath: detail.backdrop_path,
    overview: detail.overview,
    releaseDate: detail.release_date,
    genres: (detail.genres||[]).map(g=>g.name),
    isAnime: isAnimeFromDetail(detail),
    status: statusOverride || (watchedFlag ? 'completed' : 'watchlist'),
    watchedFlag: !!watchedFlag,
    watchedAt: watchedAt || null,
    runtime: detail.runtime || null,
    knownReleased: released,
    addedAt: new Date().toISOString()
  };
}

function seasonWatchedCount(item, seasonNumber){
  const s = item.watched[seasonNumber];
  if(!s) return 0;
  return Object.values(s).filter(e=>e.w).length;
}
function itemWatchedTotal(item){
  let n=0;
  for(const s in item.watched){ n += Object.values(item.watched[s]).filter(e=>e.w).length; }
  return n;
}
function itemKnownTotal(item){
  return item.knownEpisodeCount || 0;
}

function computeTotalWatchedMinutes(){
  const DEFAULT_MOVIE_MIN = 100;
  const DEFAULT_EPISODE_MIN = 40;
  let total = 0;
  for(const item of LIB){
    if(item.mediaType==='movie'){
      if(item.watchedFlag) total += item.runtime || DEFAULT_MOVIE_MIN;
    } else if(item.mediaType==='tv'){
      const watchedEps = itemWatchedTotal(item);
      total += watchedEps * (item.episodeRuntime || DEFAULT_EPISODE_MIN);
    }
  }
  return total;
}
function brandStatText(){
  if(BRAND_STAT_VIEW==='time'){
    const mins = computeTotalWatchedMinutes();
    const h = Math.floor(mins/60), m = mins%60;
    return h+'h '+m+'m viste';
  }
  return LIB.length + ' titoli in libreria';
}

function setEpisodeWatched(item, seasonNumber, episodeNumber, watched){
  if(!item.watched[seasonNumber]) item.watched[seasonNumber] = {};
  if(watched){
    item.watched[seasonNumber][episodeNumber] = {w:true, at:new Date().toISOString()};
  } else {
    delete item.watched[seasonNumber][episodeNumber];
  }
}
function setSeasonWatched(item, seasonNumber, watched){
  const meta = (item.seasonsMeta||[]).find(s=>s.season_number===seasonNumber);
  const count = meta ? meta.episode_count : 0;
  if(!item.watched[seasonNumber]) item.watched[seasonNumber] = {};
  for(let e=1; e<=count; e++){
    if(watched) item.watched[seasonNumber][e] = {w:true, at:new Date().toISOString()};
    else delete item.watched[seasonNumber][e];
  }
}
function setSeriesWatched(item, watched){
  (item.seasonsMeta||[]).forEach(s=>{
    if(s.season_number>0) setSeasonWatched(item, s.season_number, watched);
  });
  if(watched) item.status = 'completed';
}

function autoStatusFromWatched(item){
  const total = itemKnownTotal(item);
  const watched = itemWatchedTotal(item);
  if(total>0 && watched>=total) return 'completed';
  if(watched>0) return 'watching';
  return 'watchlist';
}

/* =========================================================
   UPDATE CHECK (notifications)
========================================================= */
async function checkForUpdates(silent){
  const tvItems = LIB.filter(i=>i.mediaType==='tv');
  const movieItems = LIB.filter(i=>i.mediaType==='movie' && !i.watchedFlag);
  let newCount = 0;
  const today = todayISO();

  await runPool(tvItems, async (item)=>{
    try{
      const fresh = await tmdbGetTV(item.tmdbId);
      if(!fresh) return;
      const seasonsMeta = (fresh.seasons||[]).filter(s=>s.season_number!==undefined)
        .map(s=>({season_number:s.season_number, name:s.name, episode_count:s.episode_count, air_date:s.air_date}));
      const totalKnown = seasonsMeta.filter(s=>s.season_number>0).reduce((a,s)=>a+(s.episode_count||0),0);
      if(totalKnown > (item.knownEpisodeCount||0)){
        const diff = totalKnown - (item.knownEpisodeCount||0);
        NOTIFS.unshift({id:uid(), kind:'episode', itemId:item.id, title:item.title,
          message: diff===1 ? 'Nuovo episodio disponibile' : diff+' nuovi episodi disponibili',
          date:today, read:false});
        newCount++;
      }
      item.seasonsMeta = seasonsMeta;
      item.knownEpisodeCount = totalKnown;
      item.tmdbStatus = fresh.status;
      item.inProduction = fresh.in_production;
      item.nextEpisodeToAir = fresh.next_episode_to_air ? {
        air_date: fresh.next_episode_to_air.air_date,
        episode_number: fresh.next_episode_to_air.episode_number,
        season_number: fresh.next_episode_to_air.season_number,
        name: fresh.next_episode_to_air.name
      } : null;
    }catch(e){ /* skip on error */ }
  }, 5);

  await runPool(movieItems, async (item)=>{
    if(item.releaseDate && item.releaseDate <= today && !item.knownReleased){
      NOTIFS.unshift({id:uid(), kind:'movie', itemId:item.id, title:item.title, message:'È uscito!', date:today, read:false});
      item.knownReleased = true;
      newCount++;
    }
  }, 5);

  SETTINGS.lastCheck = new Date().toISOString();
  await saveLibrary(); await saveNotifs(); await saveSettings();
  if(!silent) showToast(newCount>0 ? (newCount+' novità trovate') : 'Nessuna novità al momento');
  render();
}

/* =========================================================
   IMPORT (TV Time JSON export format)
========================================================= */
function mapTVTimeStatus(tvtStatus, item){
  const watched = itemWatchedTotal(item);
  const total = itemKnownTotal(item);
  if(total>0 && watched>=total) return 'completed';
  if(tvtStatus === 'stopped') return 'paused';
  if(watched>0) return 'watching';
  return 'watchlist';
}

async function importSeriesJSON(seriesArray){
  IMPORT_STATE.log.push('Trovate '+seriesArray.length+' serie nel file.');
  render();
  let matched=0, merged=0, notFound=[];
  await runPool(seriesArray, async (entry, i)=>{
    IMPORT_STATE.progress = i+1; IMPORT_STATE.total = seriesArray.length;
    const tmdbIdDirect = entry.id && entry.id.tmdb;
    const tvdbId = entry.id && entry.id.tvdb;
    let tvId;
    if(tmdbIdDirect){
      tvId = tmdbIdDirect;
    } else if(tvdbId){
      let found;
      try{ found = await tmdbFind(tvdbId, 'tvdb_id'); }
      catch(e){ notFound.push(entry.title+' (errore ricerca)'); render(); return; }
      const tvResult = found && found.tv_results && found.tv_results[0];
      tvId = tvResult && tvResult.id;
    }
    if(!tvId && entry.title){
      // fallback: ricerca testuale per titolo quando l'ID esterno non produce match
      let results;
      try{ results = await tmdbSearchTV(entry.title); }
      catch(e){ notFound.push(entry.title+' (errore ricerca)'); render(); return; }
      if(results && results[0]) tvId = results[0].id;
    }
    if(!tvId){ notFound.push(entry.title+(entry.id&&(entry.id.tmdb||entry.id.tvdb)?'':' (nessun ID)')); render(); return; }

    let existing = findLibItem(tvId, 'tv');
    let item;
    if(existing){
      item = existing; merged++;
    } else {
      let detail;
      try{ detail = await tmdbGetTV(tvId); }catch(e){ notFound.push(entry.title+' (dettaglio non disponibile)'); render(); return; }
      if(!detail){ notFound.push(entry.title); render(); return; }
      item = buildTVItem(detail);
      LIB.push(item);
    }
    // apply watched map from TV Time seasons
    (entry.seasons||[]).forEach(season=>{
      (season.episodes||[]).forEach(ep=>{
        if(ep.is_watched){
          setEpisodeWatched(item, season.number, ep.number, true);
          if(ep.watched_at){
            item.watched[season.number][ep.number].at = ep.watched_at;
          }
        }
      });
    });
    item.status = mapTVTimeStatus(entry.status, item);
    matched++;
    render();
  }, 5);

  IMPORT_STATE.summary = {type:'serie', total:seriesArray.length, matched, merged, notFound};
  IMPORT_STATE.log.push('Import serie completato: '+matched+' importate, '+notFound.length+' non trovate.');
  await saveLibrary();
  render();
}

async function importMoviesJSON(moviesArray){
  IMPORT_STATE.log.push('Trovati '+moviesArray.length+' film nel file.');
  render();
  let matched=0, notFound=[];
  await runPool(moviesArray, async (entry, i)=>{
    IMPORT_STATE.progress = i+1; IMPORT_STATE.total = moviesArray.length;
    const tmdbIdDirect = entry.id && entry.id.tmdb;
    const imdbId = entry.id && entry.id.imdb;
    const tvdbId = entry.id && entry.id.tvdb;
    let movieId;
    if(tmdbIdDirect){
      movieId = tmdbIdDirect;
    } else {
      let found = null;
      try{
        if(imdbId) found = await tmdbFind(imdbId, 'imdb_id');
        if((!found || !found.movie_results || !found.movie_results.length) && tvdbId){
          found = await tmdbFind(tvdbId, 'tvdb_id');
        }
      }catch(e){ notFound.push(entry.title+' (errore ricerca)'); render(); return; }
      const movieResult = found && found.movie_results && found.movie_results[0];
      movieId = movieResult && movieResult.id;
      if(!movieId && entry.title){
        // fallback: ricerca testuale per titolo (e anno, se disponibile) quando l'ID esterno non produce match
        let results;
        try{ results = await tmdbSearchMovie(entry.title, entry.year); }
        catch(e){ notFound.push(entry.title+' (errore ricerca)'); render(); return; }
        if(results && results[0]) movieId = results[0].id;
      }
      if(!movieId){ notFound.push(entry.title); render(); return; }
    }

    let existing = findLibItem(movieId, 'movie');
    let item;
    if(existing){
      item = existing;
    } else {
      let detail;
      try{ detail = await tmdbGetMovie(movieId); }catch(e){ notFound.push(entry.title+' (dettaglio non disponibile)'); render(); return; }
      if(!detail){ notFound.push(entry.title); render(); return; }
      item = buildMovieItem(detail, entry.is_watched, entry.watched_at);
      LIB.push(item);
    }
    if(entry.is_watched){
      item.watchedFlag = true;
      item.watchedAt = entry.watched_at || item.watchedAt;
      item.status = 'completed';
    }
    matched++;
    render();
  }, 5);

  IMPORT_STATE.summary = {type:'film', total:moviesArray.length, matched, notFound};
  IMPORT_STATE.log.push('Import film completato: '+matched+' importati, '+notFound.length+' non trovati.');
  await saveLibrary();
  render();
}

function readFileAsJSON(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{ try{ resolve(JSON.parse(reader.result)); }catch(e){ reject(e); } };
    reader.onerror = reject;
    reader.readAsText(file);
  });
}

async function runFullImport(){
  if(!IMPORT_STATE.seriesFile && !IMPORT_STATE.moviesFile){ showToast('Seleziona almeno un file'); return; }
  IMPORT_STATE.running = true; IMPORT_STATE.log = []; IMPORT_STATE.progress=0; IMPORT_STATE.total=0; IMPORT_STATE.summary=null;
  render();
  try{
    if(IMPORT_STATE.seriesFile){
      const data = await readFileAsJSON(IMPORT_STATE.seriesFile);
      const seriesArr = Array.isArray(data) ? data : ((data && Array.isArray(data.series)) ? data.series : []);
      await importSeriesJSON(seriesArr);
    }
    if(IMPORT_STATE.moviesFile){
      IMPORT_STATE.progress=0; IMPORT_STATE.total=0;
      const data = await readFileAsJSON(IMPORT_STATE.moviesFile);
      const moviesArr = Array.isArray(data) ? data : ((data && Array.isArray(data.movies)) ? data.movies : []);
      await importMoviesJSON(moviesArr);
    }
    showToast('Importazione completata');
  }catch(e){
    IMPORT_STATE.log.push('Errore: '+e.message);
  }
  IMPORT_STATE.running = false;
  render();
}

/* =========================================================
   FORMAT HELPERS
========================================================= */
function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('it-IT', {day:'numeric', month:'short', year:'numeric'});
}
function fmtDateShort(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('it-IT', {day:'2-digit', month:'short'});
}
function typeLabel(item){
  if(item.mediaType==='movie') return 'Film';
  return item.isAnime ? 'Anime' : 'Serie';
}
function typeClass(item){
  if(item.mediaType==='movie') return 'movie';
  return item.isAnime ? 'anime' : 'tv';
}
function statusLabel(s){
  return {watchlist:'Da vedere', watching:'In corso', completed:'Completato', paused:'In pausa'}[s] || s;
}

/* =========================================================
   RENDER: FILMSTRIP (signature progress element)
========================================================= */
function renderFilmstrip(item){
  const total = itemKnownTotal(item);
  const watched = itemWatchedTotal(item);
  const animeClass = item.isAnime ? ' anime' : '';
  if(total<=0){
    return '<div class="progress-label"><span>Nessun episodio ancora</span></div>';
  }
  if(total<=60){
    let ticks='';
    for(let i=0;i<total;i++){
      ticks += '<div class="tick'+(i<watched?' on':'')+'"></div>';
    }
    return '<div class="filmstrip'+animeClass+'">'+ticks+'</div>'+
      '<div class="progress-label"><span>'+watched+'/'+total+'</span><span>'+Math.round(watched/total*100)+'%</span></div>';
  }
  const pct = Math.round(watched/total*100);
  return '<div class="filmstrip-bar'+animeClass+'"><div class="fill" style="width:'+pct+'%"></div></div>'+
    '<div class="progress-label"><span>'+watched+'/'+total+'</span><span>'+pct+'%</span></div>';
}

  html += '<div class="seg">'+
    ['all:Tutto','tv:Serie','anime:Anime','movie:Film']
      .map(s=>{const [v,l]=s.split(':'); return '<button data-filter-type="'+v+'" class="'+(FILTER.type===v?'active':'')+'">'+l+'</button>';}).join('')+
    '</div>';
  html += '<div class="search-box">🔎<input id="lib-search" placeholder="Cerca in libreria…" value="'+esc(FILTER.q)+'"></div>';
  html += '<div class="count-pill">'+items.length+' risultati</div>';
  html += '<button class="btn-sm" id="export-lib-btn">⭳ Esporta libreria</button>';
  html += '</div>';

  if(items.length===0){
    html += '<div class="empty"><div class="em-mark">Vuoto</div><p>'+(LIB.length===0 ? 'La tua libreria è vuota. Usa «Cerca» per aggiungere titoli o «Importa» per caricare il tuo storico.' : 'Nessun titolo corrisponde ai filtri selezionati.')+'</p></div>';
  } else {
    items.sort((a,b)=> (b.addedAt||'').localeCompare(a.addedAt||''));
    html += '<div class="grid">'+items.map(renderCard).join('')+'</div>';
  }
  return html;
}

function renderCard(item){
  const poster = posterUrl(item.posterPath);
  const posterHtml = poster ? '<img src="'+poster+'" alt="" loading="lazy">' : '<div class="poster-empty">'+esc(item.title)+'</div>';
  let progress = '';
  if(item.mediaType==='tv'){
    progress = renderFilmstrip(item);
  } else {
    progress = '<div class="progress-label"><span>'+(item.watchedFlag?'Visto':'Non visto')+'</span><span>'+(item.releaseDate?fmtDateShort(item.releaseDate):'')+'</span></div>';
  }
  return '<div class="card" data-open="'+item.id+'">'+
    '<div class="poster-wrap">'+posterHtml+
      '<div class="badge-type '+typeClass(item)+'">'+typeLabel(item)+'</div>'+
      '<div class="badge-status">'+statusLabel(item.status)+'</div>'+
    '</div>'+
    '<div class="card-body">'+
      '<div class="card-title">'+esc(item.title)+'</div>'+
      progress+
    '</div>'+
  '</div>';
}

/* =========================================================
   RENDER: CALENDAR
========================================================= */
function renderCalendarView(){
  const today = todayISO();
  let upcoming = [];
  LIB.forEach(item=>{
    if(item.mediaType==='tv' && item.status!=='paused' && item.nextEpisodeToAir && item.nextEpisodeToAir.air_date){
      upcoming.push({date:item.nextEpisodeToAir.air_date, item, sub:'S'+String(item.nextEpisodeToAir.season_number).padStart(2,'0')+'E'+String(item.nextEpisodeToAir.episode_number).padStart(2,'0')+' — '+(item.nextEpisodeToAir.name||'')});
    }
    if(item.mediaType==='movie' && item.releaseDate && item.releaseDate>=today && !item.watchedFlag){
      upcoming.push({date:item.releaseDate, item, sub:'Uscita film'});
    }
  });
  upcoming.sort((a,b)=>a.date.localeCompare(b.date));

  let html = '<div class="section-title">Prossime <span>uscite</span></div>';
  if(upcoming.length===0){
    html += '<div class="empty"><div class="em-mark">Niente in arrivo</div><p>Nessuna data di uscita nota per i titoli in libreria. Premi «Aggiorna ora» dalla libreria o aggiungi nuovi titoli.</p></div>';
    return html;
  }
  html += '<div class="cal-list">'+upcoming.map(u=>{
    const d = new Date(u.date+'T00:00:00');
    const day = isNaN(d) ? '' : d.getDate();
    const mon = isNaN(d) ? '' : d.toLocaleDateString('it-IT',{month:'short'});
    const poster = posterUrl(u.item.posterPath);
    return '<div class="cal-row" data-open="'+u.item.id+'">'+
      '<div class="cal-date"><span class="d">'+day+'</span>'+mon+'</div>'+
      (poster?'<img class="cal-poster" src="'+poster+'">':'<div class="cal-poster"></div>')+
      '<div class="cal-info"><div class="cal-title">'+esc(u.item.title)+'</div><div class="cal-sub">'+esc(u.sub)+'</div></div>'+
    '</div>';
  }).join('')+'</div>';
  return html;
}

/* =========================================================
   RENDER: SEARCH
========================================================= */
function renderSearchView(){
  let html = '<div class="section-title">Cerca su <span>TMDB</span></div>';
  html += '<div class="search-hero"><input id="search-input" placeholder="Titolo di una serie, anime o film…" value="'+esc(SEARCH_QUERY)+'"><button id="search-btn">Cerca</button></div>';
  if(SEARCH_LOADING){
    html += '<div class="empty"><div class="em-mark">Cerco…</div></div>';
  } else if(SEARCH_RESULTS.length>0){
    html += SEARCH_RESULTS.map(renderSearchResult).join('');
  } else if(SEARCH_QUERY){
    html += '<div class="empty"><div class="em-mark">Nessun risultato</div></div>';
  }
  return html;
}

function renderSearchResult(r){
  const title = r.title || r.name;
  const date = r.release_date || r.first_air_date || '';
  const year = date ? date.slice(0,4) : '—';
  const type = r.media_type==='movie' ? 'Film' : (((r.origin_country||[]).includes('JP') && (r.genre_ids||[]).includes(GENRE_ANIMATION)) ? 'Anime' : 'Serie');
  const already = findLibItem(r.id, r.media_type);
  const poster = posterUrl(r.poster_path);
  return '<div class="result-card">'+
    (poster?'<img class="result-poster" src="'+poster+'">':'<div class="result-poster"></div>')+
    '<div class="result-info"><div class="result-title">'+esc(title)+'</div>'+
    '<div class="result-meta">'+type+' · '+year+'</div>'+
    (r.overview?'<div class="result-overview">'+esc(r.overview)+'</div>':'')+
    '</div>'+
    '<button class="btn-add '+(already?'added':'')+'" data-add-result="'+r.id+'" data-add-type="'+r.media_type+'" '+(already?'disabled':'')+'>'+(already?'Aggiunta ✓':'+ Aggiungi')+'</button>'+
  '</div>';
}

/* =========================================================
   RENDER: IMPORT
========================================================= */
function renderImportView(){
  let html = '<div class="section-title">Importa da <span>TV Time</span></div>';
  html += '<p style="font-size:12px;color:var(--text-faint);margin:-8px 0 18px;max-width:520px;">Accetta i file JSON esportati da TV Time, oppure il file generato da «Esporta libreria»: in tal caso seleziona lo stesso file in entrambi i campi qui sotto.</p>';
  html += '<div class="import-card"><h3>File serie TV</h3><p>Il file JSON esportato da TV Time contenente le tue serie e anime seguiti, con gli episodi segnati come visti.</p>';
  html += '<div class="file-drop'+(IMPORT_STATE.seriesFile?' has-file':'')+'">'+
    (IMPORT_STATE.seriesFile ? '✓ '+esc(IMPORT_STATE.seriesFile.name) : 'Trascina qui il file o clicca per selezionarlo (.json)')+
    '<input type="file" id="file-series" accept=".json">'+
  '</div></div>';

  html += '<div class="import-card"><h3>File film</h3><p>Il file JSON esportato da TV Time contenente i tuoi film, con lo stato di visione.</p>';
  html += '<div class="file-drop'+(IMPORT_STATE.moviesFile?' has-file':'')+'">'+
    (IMPORT_STATE.moviesFile ? '✓ '+esc(IMPORT_STATE.moviesFile.name) : 'Trascina qui il file o clicca per selezionarlo (.json)')+
    '<input type="file" id="file-movies" accept=".json">'+
  '</div>';

  html += '<button class="btn-primary" id="run-import" style="margin-top:16px" '+(IMPORT_STATE.running?'disabled':'')+'>'+(IMPORT_STATE.running?'Importazione in corso…':'Avvia importazione')+'</button>';

  if(IMPORT_STATE.running || IMPORT_STATE.log.length>0){
    const pct = IMPORT_STATE.total>0 ? Math.round(IMPORT_STATE.progress/IMPORT_STATE.total*100) : 0;
    html += '<div class="import-progress">';
    if(IMPORT_STATE.running){
      html += '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div>';
      html += '<div class="import-log">'+IMPORT_STATE.progress+' / '+IMPORT_STATE.total+'</div>';
    }
    html += '<div class="import-log">'+IMPORT_STATE.log.map(esc).join('<br>')+'</div>';
    html += '</div>';
  }

  if(IMPORT_STATE.summary && !IMPORT_STATE.running){
    const s = IMPORT_STATE.summary;
    html += '<div class="import-summary">Importazione '+s.type+': <b>'+s.matched+'</b> importati su <b>'+s.total+'</b>'+
      (s.notFound.length>0 ? ', <b>'+s.notFound.length+'</b> non trovati su TMDB.' : '.')+
      '</div>';
    if(s.notFound.length>0){
      html += '<div style="font-size:11px;color:var(--text-faint);font-family:var(--mono);margin-top:10px;">Titoli non trovati:</div>';
      html += '<div class="notfound-list">'+s.notFound.map((t,i)=>(i+1)+'. '+esc(t)).join('<br>')+'</div>';
    }
  }

  html += '</div>';
  return html;
}

/* =========================================================
   RENDER: MODAL
========================================================= */
function renderModal(){
  const item = LIB.find(i=>i.id===OPEN_ITEM);
  if(!item) return '';
  const backdrop = backdropUrl(item.backdropPath) || posterUrl(item.posterPath);
  let html = '<div class="modal-overlay" data-close-modal="1"><div class="modal" data-stop="1">';
  html += '<div class="modal-hero" style="'+(backdrop?'background-image:url('+backdrop+')':'')+'"><button class="modal-close" data-close-modal="1">✕</button></div>';
  html += '<div class="modal-body">';
  html += '<div class="modal-title">'+esc(item.title)+'</div>';
  html += '<div class="modal-meta">'+typeLabel(item)+' · '+(item.mediaType==='tv'?fmtDate(item.firstAirDate):fmtDate(item.releaseDate))+(item.genres&&item.genres.length?' · '+item.genres.join(', '):'')+'</div>';
  if(item.overview) html += '<div class="modal-overview">'+esc(item.overview)+'</div>';

  html += '<div class="status-row">';
  ['watchlist','watching','completed','paused'].forEach(s=>{
    html += '<button class="status-btn '+(item.status===s?'active':'')+'" data-set-status="'+s+'">'+statusLabel(s)+'</button>';
  });
  html += '</div>';

  if(item.mediaType==='tv'){
    html += '<div class="modal-actions"><button class="btn-sm" data-mark-series="watch">✓ Segna tutta la serie come vista</button>'+
      '<button class="btn-sm" data-mark-series="unwatch">↺ Azzera visione</button></div>';
    html += '<div class="season-list">'+(item.seasonsMeta||[]).slice().sort((a,b)=>a.season_number-b.season_number).map(s=>renderSeasonBlock(item,s)).join('')+'</div>';
  } else {
    const on = item.watchedFlag;
    html += '<div class="movie-actions"><button class="toggle-watched '+(on?'on':'')+'" data-toggle-movie="1">'+(on?'✓ Visto':'Segna come visto')+'</button>'+
      (item.releaseDate?'<span class="cal-sub">Uscita: '+fmtDate(item.releaseDate)+'</span>':'')+'</div>';
  }

  html += '<a class="remove-link" data-remove-item="1">Rimuovi dalla libreria</a>';
  html += '</div></div></div>';
  return html;
}

function renderSeasonBlock(item, s){
  if(s.season_number===0 && (s.episode_count||0)===0) return '';
  const watchedC = seasonWatchedCount(item, s.season_number);
  const total = s.episode_count||0;
  const expanded = !!EXPANDED_SEASONS[s.season_number];
  let body = '';
  if(expanded){
    const eps = OPEN_SEASONS[s.season_number];
    if(!eps){
      body = '<div class="episode-loading">Caricamento episodi…</div>';
    } else {
      body = '<div class="episode-grid">'+eps.map(ep=>{
        const w = item.watched[s.season_number] && item.watched[s.season_number][ep.episode_number] && item.watched[s.season_number][ep.episode_number].w;
        return '<div class="ep-chip '+(w?'watched':'')+'" title="'+esc(ep.name||'')+'" data-toggle-ep="'+s.season_number+':'+ep.episode_number+'">'+ep.episode_number+'</div>';
      }).join('')+'</div>';
    }
  }
  return '<div class="season-block">'+
    '<div class="season-head" data-toggle-season="'+s.season_number+'">'+
      '<div><div class="season-name">'+esc(s.name||('Stagione '+s.season_number))+'</div><div class="season-progress">'+watchedC+'/'+total+' episodi'+(s.air_date?' · '+fmtDate(s.air_date):'')+'</div></div>'+
      '<button class="season-mark-btn" data-mark-season="'+s.season_number+'">SEGNA VISTA</button>'+
    '</div>'+
    (expanded ? body : '')+
  '</div>';
}

function exportLibrary(){
  try{
    const seriesOut = [];
    const moviesOut = [];
    LIB.forEach(item=>{
      if(item.mediaType==='tv'){
        const seasons = [];
        Object.keys(item.watched||{}).forEach(sn=>{
          const epMap = item.watched[sn] || {};
          const episodes = Object.keys(epMap)
            .filter(en=>epMap[en] && epMap[en].w)
            .map(en=>({number:parseInt(en,10), is_watched:true, watched_at:epMap[en].at||null}));
          if(episodes.length) seasons.push({number:parseInt(sn,10), episodes});
        });
        seriesOut.push({
          title: item.title,
          id: {tmdb: item.tmdbId},
          status: item.status==='paused' ? 'stopped' : 'active',
          seasons
        });
      } else if(item.mediaType==='movie'){
        moviesOut.push({
          title: item.title,
          id: {tmdb: item.tmdbId},
          is_watched: !!item.watchedFlag,
          watched_at: item.watchedAt || null
        });
      }
    });
    const payload = {
      exportedAt: new Date().toISOString(),
      app: 'MediaTracker',
      version: 2,
      series: seriesOut,
      movies: moviesOut
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = 'mediatracker-libreria-'+stamp+'.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    showToast('Libreria esportata');
  }catch(e){
    showToast('Errore durante l\'esportazione');
  }
}

function showToast(msg){
  const el = document.createElement('div');
  el.className='toast'; el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(TOAST_TIMER);
  setTimeout(()=>el.remove(), 3200);
}

/* =========================================================
   EVENTS
========================================================= */
function attachEvents(){
  const app = document.getElementById('app');

  const brandStat = document.getElementById('brand-stat');
  if(brandStat){
    brandStat.onclick = ()=>{ BRAND_STAT_VIEW = (BRAND_STAT_VIEW==='count' ? 'time' : 'count'); render(); };
  }

  const setupSaveBtn = document.getElementById('setup-save-btn');
  if(setupSaveBtn){
    setupSaveBtn.onclick = async ()=>{
      const input = document.getElementById('setup-key-input');
      const errEl = document.getElementById('setup-error');
      const key = (input.value||'').trim();
      if(!key){ errEl.textContent = 'Incolla la tua API key prima di continuare.'; return; }
      // Verifica rapida che la chiave funzioni
      setupSaveBtn.disabled = true;
      setupSaveBtn.textContent = 'Verifica…';
      try{
        const testUrl = new URL(TMDB_BASE+'/configuration');
        testUrl.searchParams.set('api_key', key);
        const res = await fetch(testUrl.toString());
        if(!res.ok){ throw new Error('Chiave non valida (status '+res.status+')'); }
      }catch(e){
        errEl.textContent = 'Chiave non valida o errore di rete. Controllala e riprova.';
        setupSaveBtn.disabled = false;
        setupSaveBtn.textContent = 'Salva e avvia';
        return;
      }
      TMDB_KEY = key;
      SETTINGS.tmdbKey = key;
      await saveSettings();
      setupSaveBtn.textContent = 'Salva e avvia';
      setupSaveBtn.disabled = false;
      if(VIEW==='settings') render();
      else{ VIEW='library'; render(); checkForUpdates(true).catch(()=>{}); }
    };
  }

  app.querySelectorAll('[data-nav]').forEach(el=>{
    el.onclick = ()=>{ VIEW = el.getAttribute('data-nav'); if(VIEW==='search'){SEARCH_RESULTS=SEARCH_RESULTS;} render(); };
  });

  app.querySelectorAll('[data-filter-status]').forEach(el=>{
    el.onclick = ()=>{ FILTER.status = el.getAttribute('data-filter-status'); render(); };
  });
  app.querySelectorAll('[data-filter-type]').forEach(el=>{
    el.onclick = ()=>{ FILTER.type = el.getAttribute('data-filter-type'); render(); };
  });
  const libSearch = document.getElementById('lib-search');
  if(libSearch){
    libSearch.oninput = ()=>{ FILTER.q = libSearch.value; render(); setTimeout(()=>{ const el=document.getElementById('lib-search'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length);} },0); };
  }

  app.querySelectorAll('[data-open]').forEach(el=>{
    el.onclick = (e)=>{ OPEN_ITEM = el.getAttribute('data-open'); EXPANDED_SEASONS={}; OPEN_SEASONS={}; render(); };
  });
  app.querySelectorAll('[data-close-modal]').forEach(el=>{
    el.onclick = (e)=>{ if(e.target===el){ OPEN_ITEM=null; render(); } };
  });
  const modalInner = app.querySelector('[data-stop]');
  if(modalInner) modalInner.onclick = (e)=>e.stopPropagation();

  app.querySelectorAll('[data-set-status]').forEach(el=>{
    el.onclick = async ()=>{
      const item = LIB.find(i=>i.id===OPEN_ITEM);
      if(item){ item.status = el.getAttribute('data-set-status'); await saveLibrary(); render(); }
    };
  });
  app.querySelectorAll('[data-toggle-movie]').forEach(el=>{
    el.onclick = async ()=>{
      const item = LIB.find(i=>i.id===OPEN_ITEM);
      if(item){
        item.watchedFlag = !item.watchedFlag;
        item.watchedAt = item.watchedFlag ? new Date().toISOString() : null;
        item.status = item.watchedFlag ? 'completed' : 'watchlist';
        await saveLibrary(); render();
      }
    };
  });
  app.querySelectorAll('[data-remove-item]').forEach(el=>{
    el.onclick = async ()=>{
      if(!confirm('Rimuovere questo titolo dalla libreria?')) return;
      LIB = LIB.filter(i=>i.id!==OPEN_ITEM);
      OPEN_ITEM = null;
      await saveLibrary(); render();
    };
  });
  app.querySelectorAll('[data-mark-series]').forEach(el=>{
    el.onclick = async ()=>{
      const item = LIB.find(i=>i.id===OPEN_ITEM);
      if(item){
        setSeriesWatched(item, el.getAttribute('data-mark-series')==='watch');
        if(el.getAttribute('data-mark-series')!=='watch') item.status = autoStatusFromWatched(item);
        await saveLibrary(); render();
      }
    };
  });
  app.querySelectorAll('[data-mark-season]').forEach(el=>{
    el.onclick = async (e)=>{
      e.stopPropagation();
      const item = LIB.find(i=>i.id===OPEN_ITEM);
      const sn = parseInt(el.getAttribute('data-mark-season'),10);
      if(item){
        const currentlyFull = seasonWatchedCount(item, sn) >= ((item.seasonsMeta.find(s=>s.season_number===sn)||{}).episode_count||0);
        setSeasonWatched(item, sn, !currentlyFull);
        item.status = autoStatusFromWatched(item);
        await saveLibrary(); render();
      }
    };
  });
  app.querySelectorAll('[data-toggle-season]').forEach(el=>{
    el.onclick = async ()=>{
      const sn = parseInt(el.getAttribute('data-toggle-season'),10);
      EXPANDED_SEASONS[sn] = !EXPANDED_SEASONS[sn];
      render();
      if(EXPANDED_SEASONS[sn] && !OPEN_SEASONS[sn]){
        const item = LIB.find(i=>i.id===OPEN_ITEM);
        try{
          const data = await tmdbGetSeason(item.tmdbId, sn);
          OPEN_SEASONS[sn] = (data && data.episodes) ? data.episodes : [];
        }catch(e){ OPEN_SEASONS[sn] = []; }
        render();
      }
    };
  });
  app.querySelectorAll('[data-toggle-ep]').forEach(el=>{
    el.onclick = async (e)=>{
      e.stopPropagation();
      const [sn, en] = el.getAttribute('data-toggle-ep').split(':').map(Number);
      const item = LIB.find(i=>i.id===OPEN_ITEM);
      if(item){
        const cur = item.watched[sn] && item.watched[sn][en] && item.watched[sn][en].w;
        setEpisodeWatched(item, sn, en, !cur);
        item.status = autoStatusFromWatched(item);
        await saveLibrary(); render();
      }
    };
  });

  app.querySelectorAll('[data-add-result]').forEach(el=>{
    el.onclick = async ()=>{
      const id = parseInt(el.getAttribute('data-add-result'),10);
      const type = el.getAttribute('data-add-type');
      const r = SEARCH_RESULTS.find(x=>x.id===id && x.media_type===type);
      if(!r) return;
      el.disabled = true; el.textContent = '…';
      try{
        if(type==='tv'){
          const detail = await tmdbGetTV(id);
          if(detail){ LIB.push(buildTVItem(detail)); }
        } else {
          const detail = await tmdbGetMovie(id);
          if(detail){ LIB.push(buildMovieItem(detail, false, null)); }
        }
        await saveLibrary();
        showToast('Aggiunto a "Da vedere"');
        render();
      }catch(e){ showToast('Errore, riprova'); }
    };
  });

  const searchBtn = document.getElementById('search-btn');
  const searchInput = document.getElementById('search-input');
  if(searchBtn && searchInput){
    const doSearch = async ()=>{
      SEARCH_QUERY = searchInput.value.trim();
      if(!SEARCH_QUERY) return;
      SEARCH_LOADING = true; render();
      try{ SEARCH_RESULTS = await tmdbSearchMulti(SEARCH_QUERY); }
      catch(e){ SEARCH_RESULTS = []; showToast('Errore nella ricerca'); }
      SEARCH_LOADING = false; render();
      setTimeout(()=>{ const si=document.getElementById('search-input'); if(si) si.focus(); },0);
    };
    searchBtn.onclick = doSearch;
    searchInput.onkeydown = (e)=>{ if(e.key==='Enter') doSearch(); };
  }

  const dismissBtn = app.querySelector('[data-action="dismiss-notifs"]');
  if(dismissBtn){
    dismissBtn.onclick = async ()=>{
      NOTIFS.forEach(n=>n.read=true);
      await saveNotifs(); render();
    };
  }

  const fileSeries = document.getElementById('file-series');
  if(fileSeries) fileSeries.onchange = ()=>{ IMPORT_STATE.seriesFile = fileSeries.files[0]||null; render(); };
  const fileMovies = document.getElementById('file-movies');
  if(fileMovies) fileMovies.onchange = ()=>{ IMPORT_STATE.moviesFile = fileMovies.files[0]||null; render(); };
  const runImportBtn = document.getElementById('run-import');
  if(runImportBtn) runImportBtn.onclick = runFullImport;

  const exportBtn = document.getElementById('export-lib-btn');
  if(exportBtn) exportBtn.onclick = exportLibrary;
}

/* =========================================================
   BOOTSTRAP
========================================================= */
async function boot(){
  try{
    LIB = await loadLibrary();
    NOTIFS = await loadNotifs();
    SETTINGS = await loadSettings();
    TMDB_KEY = SETTINGS.tmdbKey || '';
  }catch(e){
    LIB = LIB || []; NOTIFS = NOTIFS || []; SETTINGS = SETTINGS || {lastCheck:null, tmdbKey:''};
  }
  render();
  if(TMDB_KEY) checkForUpdates(true).catch(()=>{});
}
boot();
